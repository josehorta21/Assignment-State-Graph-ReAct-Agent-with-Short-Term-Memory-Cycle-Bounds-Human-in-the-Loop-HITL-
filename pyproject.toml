[project]
name = "stategraph-react-agent"
version = "1.0.0"
description = "Auditable state-graph agent with SQLite memory, cycle containment, and HITL approvals"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "José Antonio Horta Herrera"}]
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-asyncio>=0.23,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
