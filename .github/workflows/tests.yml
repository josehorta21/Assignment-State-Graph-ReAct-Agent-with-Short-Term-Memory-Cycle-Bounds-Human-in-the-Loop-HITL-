name: Python QA

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run graph, HITL, and API tests
        run: uv run pytest -v
